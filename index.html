<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>屏東好好玩｜現場掃碼直接訂購</title>

<!-- PWA：讓網頁可以「加入主畫面」，像 App 一樣開啟 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#123C43">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="屏東好好玩">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" type="image/png">

<!--
  Google Analytics 4（GA4）點擊追蹤
  ============================================
  這段程式碼負責把「誰點了前往訂購」的資料送到您自己的 GA4 帳號後台。
  啟用步驟（詳見 使用說明.md 的「點擊統計」章節）：
    1. 到 https://analytics.google.com 免費申請帳號，建立一個「資料串流」，
       拿到一組像 G-XXXXXXXXXX 的「Measurement ID」
    2. 把下面兩處的 G-XXXXXXXXXX 都換成您自己的 ID
  在還沒換成真的 ID 之前，這段程式碼不會報錯，只是不會真的送出任何資料。
-->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  gtag('js', new Date());
  gtag('config', 'G-XXXXXXXXXX');
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #0B2529;
    --lagoon: #123C43;
    --lagoon-deep: #0A2529;
    --foam: #FBF8F3;
    --sand: #EFE3D0;
    --papaya: #F4762B;
    --papaya-deep: #D9601C;
    --gold: #C9862E;
    --teal: #1FAE79;
    --logo-teal: #1FCB86;
    --logo-blue: #157ECC;
    --logo-grad: linear-gradient(135deg, var(--logo-teal) 0%, var(--logo-blue) 100%);
    --line: rgba(11,37,41,0.12);
    --line-on-dark: rgba(251,248,243,0.22);
  }

  *{ box-sizing: border-box; }
  html{ -webkit-tap-highlight-color: transparent; }
  body{
    margin:0;
    background: var(--lagoon);
    color: var(--ink);
    font-family: 'Noto Sans TC', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  a{ color: inherit; }
  button{ font-family: inherit; }

  /* ---------- Header ---------- */
  header{
    position: sticky;
    top: 0;
    z-index: 20;
    background: linear-gradient(165deg, #0E4A46 0%, var(--lagoon) 45%, var(--lagoon-deep) 100%);
    padding: 18px 18px 0 18px;
    color: var(--foam);
  }
  .brand-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 12px;
  }
  .brand-lockup{
    display:flex;
    align-items:center;
    gap: 10px;
  }
  .brand-logo{
    flex-shrink:0;
    width: 38px;
    height: auto;
    filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3));
  }
  .brand h1{
    font-family: 'Noto Serif TC', serif;
    font-weight: 900;
    font-size: 26px;
    letter-spacing: 0.02em;
    margin: 0;
  }

  .search-wrap{
    margin-top: 16px;
    display:flex;
    align-items:center;
    gap:8px;
    background: rgba(251,248,243,0.1);
    border: 1px solid var(--line-on-dark);
    border-radius: 12px;
    padding: 10px 12px;
  }
  .search-wrap svg{ flex-shrink:0; opacity:0.7; }
  .search-wrap input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color: var(--foam);
    font-size: 15px;
    font-family:'Noto Sans TC', sans-serif;
  }
  .search-wrap input::placeholder{ color: rgba(251,248,243,0.5); }

  /* coastline divider */
  .wave{ display:block; width:100%; height: 22px; margin-top: 16px; }

  /* ---------- Filters ---------- */
  .filter-bar{
    background: var(--lagoon);
    padding: 14px 18px 14px 18px;
    position: sticky;
    top: 0;
  }
  .pill-row{
    display:flex;
    gap:8px;
    overflow-x:auto;
    scrollbar-width:none;
    padding-bottom: 2px;
  }
  .pill-row::-webkit-scrollbar{ display:none; }
  .pill{
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:7px;
    position:relative;
    padding: 6px 16px 6px 10px;
    border-radius: 3px 10px 10px 3px;
    background: rgba(251,248,243,0.08);
    border: 1px solid var(--line-on-dark);
    color: rgba(251,248,243,0.85);
    font-size: 13.5px;
    font-weight: 500;
    cursor:pointer;
    white-space:nowrap;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .pill-icon{
    flex-shrink:0;
    width: 26px; height: 26px;
    border-radius: 999px;
    object-fit: contain;
    background: rgba(251,248,243,0.85);
    padding: 2px;
  }
  .pill[data-active="true"]{
    background: var(--logo-grad);
    border-color: var(--logo-blue);
    color: #fff;
    font-weight: 700;
  }
  .pill[data-cat="住宿"][data-active="true"]{ background: var(--teal); border-color: var(--teal); }
  .pill[data-cat="交通票券"][data-active="true"]{ background: var(--papaya); border-color: var(--papaya); }
  .pill[data-cat="門票・體驗"][data-active="true"]{ background: var(--gold); border-color: var(--gold); }

  .meta-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    row-gap:8px;
    margin-top: 12px;
    gap: 10px;
  }
  .meta-left{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .toggle-btn{
    display:flex;
    align-items:center;
    gap:6px;
    padding: 7px 12px;
    border-radius: 8px;
    background: rgba(251,248,243,0.08);
    border: 1px solid var(--line-on-dark);
    color: var(--foam);
    font-size: 12.5px;
    font-weight:500;
    cursor:pointer;
    white-space:nowrap;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .toggle-btn[data-active="true"]{
    background: var(--logo-grad);
    border-color: var(--logo-blue);
    color:#fff;
    font-weight:700;
  }
  .toggle-btn:disabled{ opacity:0.5; cursor:default; }
  .region-select{
    appearance:none;
    background: rgba(251,248,243,0.08);
    border: 1px solid var(--line-on-dark);
    color: var(--foam);
    padding: 7px 30px 7px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-family:'Noto Sans TC', sans-serif;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0 L5 6 L10 0' fill='none' stroke='%23FBF8F3' stroke-width='1.4'/></svg>");
    background-repeat: no-repeat;
    background-position: right 10px center;
  }
  .region-select option{
    color: var(--ink);
    background: var(--foam);
  }
  .result-count{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
    color: rgba(251,248,243,0.6);
    white-space:nowrap;
  }

  /* ---------- List ---------- */
  main{
    background: var(--foam);
    border-radius: 20px 20px 0 0;
    padding: 20px 16px 60px 16px;
    min-height: 50vh;
  }
  .grid{
    display:grid;
    grid-template-columns: 1fr;
    gap: 14px;
    max-width: 980px;
    margin: 0 auto;
  }
  @media (min-width: 680px){
    .grid{ grid-template-columns: repeat(2, 1fr); }
  }
  @media (min-width: 1020px){
    .grid{ grid-template-columns: repeat(3, 1fr); }
  }

  .card{
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 16px 14px 16px;
    box-shadow: 0 1px 2px rgba(11,37,41,0.04);
    opacity: 0;
    transform: translateY(6px);
    animation: rise 0.35s ease forwards;
  }
  @keyframes rise{ to{ opacity:1; transform:none; } }

  .card-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
    margin-bottom: 8px;
  }
  .card-top-left{
    display:flex;
    align-items:center;
    gap:6px;
    flex-wrap:wrap;
  }
  .card-actions{
    display:flex;
    gap:6px;
    flex-shrink:0;
  }
  .icon-btn{
    width: 30px; height: 30px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--foam);
    color: rgba(11,37,41,0.5);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    padding:0;
    transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
  }
  .icon-btn:active{ transform: scale(0.92); }
  .icon-btn.fav-btn[data-active="true"]{
    background: rgba(239,93,111,0.12);
    color: #EF5D6F;
    border-color: rgba(239,93,111,0.3);
  }
  .featured-badge{
    display:inline-flex;
    align-items:center;
    gap:3px;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    background: linear-gradient(135deg, #FFD76A, #F4A340);
    color: #4A2E00;
  }
  .distance-tag{
    font-size: 11px;
    font-family:'IBM Plex Mono', monospace;
    color: var(--logo-blue);
    background: rgba(21,126,204,0.1);
    padding: 3px 8px;
    border-radius: 999px;
  }
  .cat-tag{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size: 11.5px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    letter-spacing: 0.03em;
  }
  .cat-tag.住宿{ background: rgba(47,111,118,0.12); color: var(--teal); }
  .cat-tag.交通票券{ background: rgba(244,118,43,0.12); color: var(--papaya-deep); }
  .cat-tag.門票・體驗{ background: rgba(201,134,46,0.14); color: var(--gold); }
  .region-tag{
    font-size: 11.5px;
    color: rgba(11,37,41,0.5);
    font-family:'IBM Plex Mono', monospace;
  }

  .card h3{
    font-family:'Noto Serif TC', serif;
    font-size: 18px;
    font-weight: 700;
    margin: 0 0 8px 0;
    line-height:1.35;
  }
  .card .line{
    display:flex;
    gap:7px;
    align-items:flex-start;
    font-size: 12.5px;
    color: rgba(11,37,41,0.62);
    line-height:1.5;
    margin-bottom: 3px;
  }
  .card .line svg{ flex-shrink:0; margin-top:2px; opacity:0.55; }
  .card .line a{ color: rgba(11,37,41,0.62); text-decoration:none; }

  .tear{
    border: none;
    border-top: 1.5px dashed rgba(11,37,41,0.18);
    margin: 12px 0 12px 0;
    position:relative;
  }
  .tear::before, .tear::after{
    content:'';
    position:absolute;
    top:-6px;
    width:12px; height:12px;
    border-radius:999px;
    background: var(--foam);
  }
  .tear::before{ left:-16px; }
  .tear::after{ right:-16px; }

  .link-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .book-btn{
    flex:1;
    min-width: 128px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    background: var(--ink);
    color: var(--foam);
    text-decoration:none;
    font-size: 13px;
    font-weight: 700;
    padding: 10px 12px;
    border-radius: 9px;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .book-btn:hover{ background: var(--logo-blue); }
  .book-btn:active{ transform: scale(0.97); }
  .book-btn svg{ flex-shrink:0; }

  .empty{
    text-align:center;
    padding: 60px 20px;
    color: rgba(11,37,41,0.5);
  }
  .empty h4{
    font-family:'Noto Serif TC', serif;
    font-size: 18px;
    color: var(--ink);
    margin: 12px 0 6px 0;
  }
  .empty p{ font-size: 13px; margin:0; }

  .toast{
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--foam);
    padding: 10px 18px;
    border-radius: 999px;
    font-size: 13px;
    max-width: 85vw;
    text-align:center;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 50;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
  }
  .toast[data-show="true"]{
    opacity:1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<header>
  <div class="brand-row">
    <div class="brand-lockup">
      <img class="brand-logo" src="images/logo.png" alt="屏東觀光圈">
      <div class="brand">
        <h1>屏東好好玩</h1>
      </div>
    </div>
  </div>

  <div class="search-wrap">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="searchInput" type="text" placeholder="搜尋店家、地址或地區…">
  </div>

  <svg class="wave" viewBox="0 0 400 22" preserveAspectRatio="none">
    <defs>
      <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="var(--logo-teal)"/>
        <stop offset="100%" stop-color="var(--logo-blue)"/>
      </linearGradient>
    </defs>
    <path d="M0 14 Q 25 2 50 14 T 100 14 T 150 14 T 200 14 T 250 14 T 300 14 T 350 14 T 400 14 V22 H0 Z" fill="var(--foam)" opacity="0.06"></path>
    <path d="M0 16 Q 25 6 50 16 T 100 16 T 150 16 T 200 16 T 250 16 T 300 16 T 350 16 T 400 16" fill="none" stroke="url(#waveGrad)" stroke-width="1.6" opacity="0.8"></path>
  </svg>
</header>

<div class="filter-bar">
  <div class="pill-row" id="pillRow"></div>
  <div class="meta-row">
    <div class="meta-left">
      <select class="region-select" id="regionSelect">
        <option value="">全部地區</option>
      </select>
      <button class="toggle-btn" id="nearbyBtn" type="button">📍 附近優先</button>
      <button class="toggle-btn" id="favFilterBtn" type="button">♥ 我的收藏</button>
    </div>
    <div class="result-count" id="resultCount"></div>
  </div>
</div>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyState" style="display:none;">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="rgba(11,37,41,0.35)" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <h4>找不到符合的店家</h4>
    <p>試試看換個關鍵字，或切換其他分類／地區</p>
  </div>
</main>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
(function(){
  const DATA = window.PINGTUNG_DATA || [];
  const CATEGORIES = ['全部', '住宿', '交通票券', '門票・體驗'];
  const CATEGORY_ICONS = {
    '全部': 'images/lighthouse.png',
    '住宿': 'images/victory-village.png',
    '交通票券': 'images/cruise.png',
    '門票・體驗': 'images/turtle.png',
  };

  // ---------- 精選標記 ----------
  // 想把某家店標成「精選」，把店名加進這個陣列即可（要跟 data.js 裡的名稱完全一致）。
  // 建議搭配 GA 報表：看到哪家店常被點擊訂購，就把店名加進來。
  const FEATURED_OVERRIDES = [
    // 例如：'小琉球海景villa',
  ];
  DATA.forEach(item => { item.featured = Boolean(item.featured) || FEATURED_OVERRIDES.includes(item.name); });

  // ---------- 鄉鎮中心點座標（用於「附近優先」估算距離，非店家精確座標）----------
  const REGION_COORDS = {
    '恆春': { lat: 22.0042, lng: 120.7419 },
    '小琉球': { lat: 22.3444, lng: 120.3778 },
    '東港': { lat: 22.4667, lng: 120.4500 },
    '車城': { lat: 22.0722, lng: 120.6989 },
    '滿州': { lat: 22.0181, lng: 120.7690 },
    '林邊': { lat: 22.4306, lng: 120.5006 },
    '枋寮': { lat: 22.3608, lng: 120.5847 },
    '新園': { lat: 22.4708, lng: 120.4294 },
    '竹田': { lat: 22.5192, lng: 120.5389 },
    '屏東': { lat: 22.6706, lng: 120.4874 },
    '高樹': { lat: 22.7519, lng: 120.5972 },
    '萬丹': { lat: 22.5911, lng: 120.4664 },
    '內埔': { lat: 22.6350, lng: 120.5606 },
    '牡丹': { lat: 22.0989, lng: 120.7833 },
    '枋山': { lat: 22.2214, lng: 120.6494 },
    '長治': { lat: 22.6875, lng: 120.5386 },
    '獅子': { lat: 22.2333, lng: 120.7167 },
    '萬巒': { lat: 22.5794, lng: 120.5539 },
  };

  // ---------- 我的收藏（存在使用者手機本地，不會上傳到任何地方）----------
  const FAV_KEY = 'pth_favorites_v1';
  function loadFavorites(){
    try { return new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]')); }
    catch(e){ return new Set(); }
  }
  function saveFavorites(){
    try { localStorage.setItem(FAV_KEY, JSON.stringify([...favorites])); } catch(e){}
  }
  const favorites = loadFavorites();

  const state = { cat: '全部', region: '', query: '', favoritesOnly: false, sortNearby: false, userLoc: null };

  const pillRow = document.getElementById('pillRow');
  const regionSelect = document.getElementById('regionSelect');
  const nearbyBtn = document.getElementById('nearbyBtn');
  const favFilterBtn = document.getElementById('favFilterBtn');
  const grid = document.getElementById('grid');
  const emptyState = document.getElementById('emptyState');
  const resultCount = document.getElementById('resultCount');
  const searchInput = document.getElementById('searchInput');
  const totalCount = document.getElementById('totalCount');
  const toastEl = document.getElementById('toast');

  if (totalCount) totalCount.textContent = DATA.length;

  // ---------- Toast 提示 ----------
  let toastTimer;
  function showToast(msg){
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.dataset.show = 'true';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toastEl.dataset.show = 'false'; }, 2400);
  }

  // ---------- 依「地區」計算的鄉鎮中心點分佈（供區域下拉選單使用）----------
  const regionCounts = {};
  DATA.forEach(item => { regionCounts[item.region] = (regionCounts[item.region] || 0) + 1; });

  // ---------- 讀取網址參數，讓不同 QR code 可以指到不同的預設畫面 ----------
  // 例如：?region=小琉球　或　?region=恆春&cat=門票・體驗　或　?q=店名
  (function applyURLParams(){
    const params = new URLSearchParams(location.search);
    const catParam = params.get('cat');
    const regionParam = params.get('region');
    const qParam = params.get('q');
    if (catParam && CATEGORIES.includes(catParam)) state.cat = catParam;
    if (regionParam && regionCounts[regionParam]) state.region = regionParam;
    if (qParam) state.query = qParam;
  })();

  // 點擊「前往 XX 訂購」時，把店家名稱／平台／分類／地區送到 Google Analytics（GA4）
  // 分享／收藏按鈕也統一用事件委派處理
  grid.addEventListener('click', event => {
    const bookBtn = event.target.closest('[data-track="book_click"]');
    if (bookBtn) {
      if (typeof gtag === 'function') {
        gtag('event', 'book_click', {
          listing_name: bookBtn.dataset.name,
          platform: bookBtn.dataset.platform,
          category: bookBtn.dataset.category,
          region: bookBtn.dataset.region,
        });
      }
      return;
    }
    const shareBtn = event.target.closest('.share-btn');
    if (shareBtn) { handleShare(shareBtn.dataset.id); return; }

    const favBtn = event.target.closest('.fav-btn');
    if (favBtn) { handleFavToggle(favBtn.dataset.id); return; }
  });

  async function handleShare(idStr){
    const item = DATA.find(d => String(d.id) === String(idStr));
    if (!item) return;
    const url = `${location.origin}${location.pathname}?q=${encodeURIComponent(item.name)}`;
    const shareData = { title: item.name, text: `${item.name}｜屏東好好玩`, url };
    if (navigator.share) {
      try { await navigator.share(shareData); } catch(e) { /* 使用者取消分享，不用處理 */ }
      return;
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      try {
        await navigator.clipboard.writeText(url);
        showToast('連結已複製，可以貼給朋友囉');
        return;
      } catch(e) { /* 掉到下面用 prompt 顯示 */ }
    }
    window.prompt('複製這個連結分享：', url);
  }

  function handleFavToggle(idStr){
    const id = Number(idStr);
    if (favorites.has(id)) favorites.delete(id); else favorites.add(id);
    saveFavorites();
    updateFavFilterLabel();
    render();
  }

  function updateFavFilterLabel(){
    favFilterBtn.textContent = `♥ 我的收藏 (${favorites.size})`;
  }
  updateFavFilterLabel();

  favFilterBtn.addEventListener('click', () => {
    state.favoritesOnly = !state.favoritesOnly;
    favFilterBtn.dataset.active = state.favoritesOnly ? 'true' : 'false';
    render();
  });

  // ---------- 附近優先（用鄉鎮中心點估算距離，非店家精確定位）----------
  function haversineKm(lat1, lng1, lat2, lng2){
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat/2) ** 2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2) ** 2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }
  function distanceFor(item){
    const coord = REGION_COORDS[item.region];
    if (!coord || !state.userLoc) return Infinity;
    return haversineKm(state.userLoc.lat, state.userLoc.lng, coord.lat, coord.lng);
  }

  nearbyBtn.addEventListener('click', () => {
    if (state.sortNearby) {
      state.sortNearby = false;
      state.userLoc = null;
      nearbyBtn.dataset.active = 'false';
      nearbyBtn.textContent = '📍 附近優先';
      render();
      return;
    }
    if (!navigator.geolocation) {
      showToast('您的裝置不支援定位功能');
      return;
    }
    nearbyBtn.disabled = true;
    nearbyBtn.textContent = '📍 定位中…';
    navigator.geolocation.getCurrentPosition(
      pos => {
        state.userLoc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        state.sortNearby = true;
        nearbyBtn.disabled = false;
        nearbyBtn.dataset.active = 'true';
        nearbyBtn.textContent = '📍 依距離排序中 ✕';
        render();
      },
      () => {
        nearbyBtn.disabled = false;
        nearbyBtn.textContent = '📍 附近優先';
        showToast('無法取得您的位置，請確認已允許定位權限');
      },
      { timeout: 8000 }
    );
  });

  // build category pills
  CATEGORIES.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'pill';
    btn.dataset.cat = cat;
    btn.dataset.active = (cat === state.cat) ? 'true' : 'false';
    btn.innerHTML = `<img class="pill-icon" src="${CATEGORY_ICONS[cat]}" alt=""><span>${escapeHTML(cat)}</span>`;
    btn.addEventListener('click', () => {
      state.cat = cat;
      [...pillRow.children].forEach(el => el.dataset.active = (el.dataset.cat === cat) ? 'true' : 'false');
      render();
    });
    pillRow.appendChild(btn);
  });

  // build region options（依筆數排序）
  Object.keys(regionCounts)
    .sort((a, b) => regionCounts[b] - regionCounts[a])
    .forEach(region => {
      const opt = document.createElement('option');
      opt.value = region;
      opt.textContent = `${region}（${regionCounts[region]}）`;
      regionSelect.appendChild(opt);
    });
  if (state.region) regionSelect.value = state.region;

  regionSelect.addEventListener('change', () => {
    state.region = regionSelect.value;
    render();
  });

  if (state.query) searchInput.value = state.query;

  let searchTimer;
  searchInput.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      state.query = searchInput.value.trim();
      render();
    }, 120);
  });

  function iconMapPin(){
    return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>';
  }
  function iconPhone(){
    return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>';
  }
  function iconArrow(){
    return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
  }
  function iconShare(){
    return '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.6" x2="15.4" y2="6.4"/><line x1="8.6" y1="13.4" x2="15.4" y2="17.6"/></svg>';
  }
  function iconHeart(filled){
    return filled
      ? '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-6.7-4.35-9.3-8.2C1 10.5 1.6 7 4.6 5.6 6.9 4.5 9.4 5.2 12 7.9c2.6-2.7 5.1-3.4 7.4-2.3 3 1.4 3.6 4.9 1.9 7.2C18.7 16.65 12 21 12 21z"/></svg>'
      : '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-6.7-4.35-9.3-8.2C1 10.5 1.6 7 4.6 5.6 6.9 4.5 9.4 5.2 12 7.9c2.6-2.7 5.1-3.4 7.4-2.3 3 1.4 3.6 4.9 1.9 7.2C18.7 16.65 12 21 12 21z"/></svg>';
  }

  function matches(item){
    if (state.cat !== '全部' && item.category !== state.cat) return false;
    if (state.region && item.region !== state.region) return false;
    if (state.favoritesOnly && !favorites.has(item.id)) return false;
    if (state.query){
      const q = state.query.toLowerCase();
      const hay = (item.name + ' ' + item.address + ' ' + item.region).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }

  function cardHTML(item, distanceKm){
    const linksHTML = item.links.map(l => `
      <a class="book-btn"
         href="${l.url}"
         target="_blank"
         rel="noopener noreferrer"
         data-track="book_click"
         data-name="${escapeHTML(item.name)}"
         data-platform="${escapeHTML(l.platform)}"
         data-category="${escapeHTML(item.category)}"
         data-region="${escapeHTML(item.region)}">
        <span>前往 ${escapeHTML(l.platform)} 訂購</span>${iconArrow()}
      </a>
    `).join('');

    const phoneLine = item.phone ? `
      <div class="line">${iconPhone()}<a href="tel:${item.phone.replace(/\s+/g,'')}">${escapeHTML(item.phone)}</a></div>
    ` : '';

    const featuredBadge = item.featured ? `<span class="featured-badge">⭐ 精選</span>` : '';
    const distanceTag = (distanceKm !== null && distanceKm !== undefined && isFinite(distanceKm))
      ? `<span class="distance-tag">約 ${distanceKm < 1 ? '<1' : distanceKm.toFixed(1)} 公里</span>`
      : '';
    const isFav = favorites.has(item.id);

    return `
      <article class="card">
        <div class="card-top">
          <div class="card-top-left">
            ${featuredBadge}
            <span class="cat-tag ${item.category}">${item.category}</span>
            <span class="region-tag">${escapeHTML(item.region)}</span>
            ${distanceTag}
          </div>
          <div class="card-actions">
            <button type="button" class="icon-btn share-btn" data-id="${item.id}" aria-label="分享">${iconShare()}</button>
            <button type="button" class="icon-btn fav-btn" data-id="${item.id}" data-active="${isFav}" aria-label="收藏">${iconHeart(isFav)}</button>
          </div>
        </div>
        <h3>${escapeHTML(item.name)}</h3>
        <div class="line">${iconMapPin()}<span>${escapeHTML(item.address)}</span></div>
        ${phoneLine}
        <hr class="tear">
        <div class="link-row">${linksHTML}</div>
      </article>
    `;
  }

  function escapeHTML(str){
    return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }

  function render(){
    let list = DATA.filter(matches);

    if (state.sortNearby && state.userLoc){
      list = list
        .map(item => ({ item, dist: distanceFor(item) }))
        .sort((a, b) => a.dist - b.dist)
        .map(x => x.item);
    } else {
      // 精選優先，其餘維持原順序
      const featuredList = list.filter(i => i.featured);
      const restList = list.filter(i => !i.featured);
      list = featuredList.concat(restList);
    }

    resultCount.textContent = `共 ${list.length} 筆`;
    if (list.length === 0){
      grid.innerHTML = '';
      emptyState.style.display = 'block';
      return;
    }
    emptyState.style.display = 'none';
    grid.innerHTML = list.map(item => {
      const dist = (state.sortNearby && state.userLoc) ? distanceFor(item) : null;
      return cardHTML(item, dist);
    }).join('');
  }

  render();
})();
</script>

<script>
  // 註冊 Service Worker，讓網頁可以離線開啟、加入主畫面後體驗更像 App
  // 注意：需部署在 https 網址（或 localhost 測試）才會生效，http 網址會自動略過
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
